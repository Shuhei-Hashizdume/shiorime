services:
  api:
    build:
      context: ./backend
      args:
        INSTALL_DEV: "true"
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - ./backend/app:/app/app
      - ./backend/tests:/app/tests
      - ./backend/alembic:/app/alembic
    command:
      [
        "uvicorn",
        "app.main:app",
        "--host",
        "0.0.0.0",
        "--port",
        "8000",
        "--reload",
      ]

  worker:
    volumes:
      - ./backend/app:/app/app

  migrate:
    volumes:
      - ./backend/app:/app/app
      - ./backend/alembic:/app/alembic
