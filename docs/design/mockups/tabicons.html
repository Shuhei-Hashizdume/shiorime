<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SHIORIME 共通メニューのアイコン</title>
<style>
  :root { --page-bg:#E8E9E7; --page-ink:#23272A; --page-sub:#5D6368; }
  @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --page-bg:#1A1C1E; --page-ink:#E6E6E2; --page-sub:#A2A7AC; } }
  :root[data-theme="dark"] { --page-bg:#1A1C1E; --page-ink:#E6E6E2; --page-sub:#A2A7AC; }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--page-bg); color:var(--page-ink); font-family:"Zen Maru Gothic","Hiragino Maru Gothic ProN",sans-serif; line-height:1.7; }
  .wrap { max-width:960px; margin:0 auto; padding:32px 16px 56px; }
  h1 { font-size:22px; margin:0 0 6px; }
  h2 { font-size:17px; margin:32px 0 4px; }
  p { margin:0; color:var(--page-sub); font-size:14px; max-width:46em; }
  .stage { margin-top:14px; background:#14232B; border-radius:20px; padding:24px; color:#ECE6D8; }
  .set { display:grid; grid-template-columns:repeat(3, minmax(0,1fr)); gap:16px; text-align:center; }
  .set figure { margin:0; }
  .pair { display:flex; justify-content:center; gap:22px; }
  .pair div { display:flex; flex-direction:column; align-items:center; gap:4px; font-size:11px; color:#9AA7AC; }
  .big svg { width:64px; height:64px; }
  figcaption { margin-top:8px; font-size:14px; }

  .tabbar { margin:0 auto; max-width:360px; background:#101C22; border-radius:0 0 26px 26px; display:grid; grid-template-columns:repeat(3,1fr); padding:8px 6px 16px; }
  .tab { display:flex; flex-direction:column; align-items:center; justify-content:center; gap:2px; min-height:48px; font-size:12px; color:#9AA7AC; background:none; border:0; font-family:inherit; cursor:pointer; }
  .tab svg { width:26px; height:26px; }
  .tab .on { display:none; } .tab .off { display:block; }
  .tab[aria-current="page"] { color:#E2A84B; font-weight:700; }
  .tab[aria-current="page"] .on { display:block; } .tab[aria-current="page"] .off { display:none; }
  .tab:focus-visible { outline:2px solid #E2A84B; outline-offset:2px; border-radius:10px; }
  .phonetop { margin:0 auto; max-width:360px; height:90px; background:#14232B; border-radius:26px 26px 0 0; border-bottom:1px solid #1C3039; display:flex; align-items:center; justify-content:center; color:#9AA7AC; font-size:13px; }

  /* 塗り＝選択中 / 線＝選択していない */
  .line { fill:none; stroke:currentColor; stroke-width:1.9; stroke-linecap:round; stroke-linejoin:round; }
  .fill { fill:currentColor; }
</style>
</head>
<body>
<div class="wrap">
  <h1>共通メニューのアイコン</h1>
  <p>アプリのアイコン（読書灯に照らされた芽）と同じ、角の丸いやわらかい形で描きました。選択中は塗りつぶし、選択していないときは線で表します。</p>

  <svg width="0" height="0" style="position:absolute" aria-hidden="true">
    <defs>
      <!-- 本棚：高さの違う3冊の本と、少し傾いた1冊 -->
      <g id="shelf-off" class="line">
        <rect x="3.5" y="6" width="4" height="13.5" rx="1.2"/>
        <rect x="8.5" y="4" width="4" height="15.5" rx="1.2"/>
        <rect x="14.6" y="5.2" width="4" height="14.6" rx="1.2" transform="rotate(-14 16.6 19.5)"/>
        <path d="M2.5 20.5 H 21.5"/>
      </g>
      <g id="shelf-on" class="fill">
        <rect x="3" y="5.5" width="5" height="14.5" rx="1.4"/>
        <rect x="8.8" y="3.5" width="5" height="16.5" rx="1.4"/>
        <rect x="14.8" y="4.6" width="5" height="15.4" rx="1.4" transform="rotate(-14 17.3 20)"/>
        <rect x="2" y="20" width="20" height="2" rx="1"/>
      </g>

      <!-- 気づき：栞を挟んだページ -->
      <g id="note-off" class="line">
        <path d="M6 3.5 H 15.5 L 19 7 V 20.5 H 6 Z"/>
        <path d="M9 3.5 V 11 L 11 9.5 L 13 11 V 3.5"/>
        <path d="M9 15 H 16 M9 17.8 H 13.5"/>
      </g>
      <g id="note-on">
        <path class="fill" d="M6.2 2.8 H 15.6 C 16 2.8 16.3 2.9 16.6 3.2 L 19.4 6 C 19.7 6.3 19.8 6.6 19.8 7 V 20.2 C 19.8 20.8 19.4 21.2 18.8 21.2 H 6.2 C 5.6 21.2 5.2 20.8 5.2 20.2 V 3.8 C 5.2 3.2 5.6 2.8 6.2 2.8 Z"/>
        <path d="M9 2.8 V 11 L 11 9.5 L 13 11 V 2.8 Z" fill="#14232B"/>
        <path d="M9 15 H 16 M9 17.8 H 13.5" fill="none" stroke="#101C22" stroke-width="1.9" stroke-linecap="round"/>
      </g>

      <!-- プロフィール：頭と肩 -->
      <g id="me-off" class="line">
        <circle cx="12" cy="8.5" r="4"/>
        <path d="M4.5 20.5 C 5.5 16.6 8.4 14.8 12 14.8 S 18.5 16.6 19.5 20.5"/>
      </g>
      <g id="me-on" class="fill">
        <circle cx="12" cy="8.3" r="4.6"/>
        <path d="M3.8 20 C 4.8 15.6 8 13.8 12 13.8 S 19.2 15.6 20.2 20 C 20.4 20.7 19.9 21.3 19.2 21.3 H 4.8 C 4.1 21.3 3.6 20.7 3.8 20 Z"/>
      </g>
    </defs>
  </svg>

  <h2>3つのアイコン</h2>
  <div class="stage">
    <div class="set">
      <figure>
        <div class="pair big">
          <div style="color:#E2A84B"><svg viewBox="0 0 24 24"><use href="#shelf-on"/></svg>選択中</div>
          <div><svg viewBox="0 0 24 24"><use href="#shelf-off"/></svg>選択していない</div>
        </div>
        <figcaption>本棚</figcaption>
      </figure>
      <figure>
        <div class="pair big">
          <div style="color:#E2A84B"><svg viewBox="0 0 24 24"><use href="#note-on"/></svg>選択中</div>
          <div><svg viewBox="0 0 24 24"><use href="#note-off"/></svg>選択していない</div>
        </div>
        <figcaption>気づき</figcaption>
      </figure>
      <figure>
        <div class="pair big">
          <div style="color:#E2A84B"><svg viewBox="0 0 24 24"><use href="#me-on"/></svg>選択中</div>
          <div><svg viewBox="0 0 24 24"><use href="#me-off"/></svg>選択していない</div>
        </div>
        <figcaption>プロフィール</figcaption>
      </figure>
    </div>
  </div>

  <h2>共通メニューに置いたとき</h2>
  <p>押すと選択が切り替わります（試せます）。</p>
  <div class="stage">
    <div class="phonetop">（画面の内容）</div>
    <nav class="tabbar" aria-label="共通メニュー">
      <button class="tab" type="button" aria-current="page"><svg viewBox="0 0 24 24" aria-hidden="true"><use class="on" href="#shelf-on"/><use class="off" href="#shelf-off"/></svg>本棚</button>
      <button class="tab" type="button"><svg viewBox="0 0 24 24" aria-hidden="true"><use class="on" href="#note-on"/><use class="off" href="#note-off"/></svg>気づき</button>
      <button class="tab" type="button"><svg viewBox="0 0 24 24" aria-hidden="true"><use class="on" href="#me-on"/><use class="off" href="#me-off"/></svg>プロフィール</button>
    </nav>
  </div>
</div>
<script>
  document.querySelectorAll('.tab').forEach(function (b) {
    b.addEventListener('click', function () {
      document.querySelectorAll('.tab').forEach(function (x) { x.removeAttribute('aria-current'); });
      b.setAttribute('aria-current', 'page');
    });
  });
</script>
</body>
</html>
